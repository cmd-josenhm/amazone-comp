# Salaires : ITS, VPS, CNSS, SMIG — 2026. Propriétaire : A7. AUCUNE valeur vérifiée.

[en_tete]
annee = 2026
textes = [
  "CGI 2026 (ITS : art. 119 à 129, barème art. 125 ; VPS : art. 191 à 201 — à vérifier)",
  "Code de sécurité sociale du Bénin (CNSS)",
  "Décret fixant le SMIG (à identifier)",
]
