  { jusqu_a = 60000, taux = "0" },
  { jusqu_a = 150000, taux = "0.10" },
  { jusqu_a = 250000, taux = "0.15" },
  { jusqu_a = 500000, taux = "0.19" },
  { taux = "0.30" },
]
