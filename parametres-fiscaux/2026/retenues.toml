# Retenues à la source — 2026. Propriétaire : A8. AUCUNE valeur vérifiée.
# Sources vérifiées le 2026-11-27 sur le CGI 2026 (livre 1, titre 1, chapitre 3 « retenues à la source »
# et chapitre 6 pour les loyers).
# Incertitudes restantes : issues #36 (critère du bailleur), #37 (non-résidents et IRCM).

[en_tete]
annee = 2026
textes = [
  "Code général des impôts du Bénin, édition 2026 — loi n° 2021-15 du 23 décembre 2021, livre 1, titre 1, chapitres 3 (retenues à la source) et 6 (impôt sur les revenus fonciers)",
  "Loi n° 2025-22 du 8 décembre 2025 portant loi de finances pour la gestion 2026",
  "Rescrits fiscaux DGI 2026 (retenue sur prestataires non-résidents, loyers et AIB)",
]
mis_a_jour_le = "2026-11-27"

[loyer_bailleur_personne_physique]
valeur = "0.12"
source = "CGI 2026, art. 106, 1) — retenue à la source de 12 % sur le montant brut des loyers, effectuée par les locataires"
verifie = false
note = "Le texte ne vise pas la forme juridique du bailleur mais son régime : le taux est réduit à 10 % lorsque le bailleur est soumis à l'IBA ou à l'IS (clé suivante). Les locataires personnes physiques sont exemptés, sauf s'ils louent par l'intermédiaire d'une entité soumise à l'impôt sur les bénéfices (art. 106, 2)). Issues #36 et #37."

[loyer_bailleur_personne_morale]
valeur = "0.10"
source = "CGI 2026, art. 106, 1) — « ce taux est réduit à 10 % lorsque le bailleur est soumis à l'impôt sur les bénéfices d'affaires ou à l'impôt sur les sociétés »"
verifie = false
note = "La clé est mal nommée : le critère légal est le régime du bailleur (IBA ou IS), pas sa forme. Une personne physique relevant de l'IBA est donc à 10 %, et une personne morale exonérée d'IS reste à 12 %. Renommage prévu au Lot 2 (une année publiée ne se réécrit pas). Issue #36."

[prestataire_non_resident]
valeur = "0.20"
source = "CGI 2026, art. 141 et 142 — retenue à la source sur les sommes dues aux personnes physiques ou morales non-résidentes n'ayant pas d'établissement stable au Bénin, en rémunération de prestations de toute nature fournies ou utilisées au Bénin, frais accessoires compris"
verifie = false
note = "Taux unique de 20 % depuis le 1er janvier 2023 quel que soit la forme juridique (rescrit DGI) ; les contrats enregistrés avant la loi de finances pour 2023 et encore en cours gardent 10 % (personnes physiques) ou 12 % (personnes morales). Sous réserve des conventions fiscales. Issue #37."

[jour_limite_reversement]
valeur = 10
source = "CGI 2026, art. 106, 4) — la retenue sur loyers est acquittée spontanément au plus tard le 10 du mois pour la part du loyer du mois précédent (le 10 du mois suivant le versement si le loyer est versé par anticipation) ; mêmes échéances mensuelles pour les autres retenues"
verifie = false

[ircm_dividendes_non_residents]
valeur = "0.05"
source = "CGI 2026, art. 86, 1) — 5 % pour les dividendes distribués aux associés non-résidents (sauf convention plus favorable) et les plus-values de cession d'actions par les particuliers ou personnes morales non-résidentes"
verifie = false
note = "Ajouté au Lot 1 : la section IRCM manquait (le fichier disait « taux non renseignés faute de source fiable »). Retenue opérée par celui qui verse les revenus (art. 90, 1)). Issue #37."

[ircm_dividendes_residents]
valeur = "0.10"
source = "CGI 2026, art. 86, 2) — 10 % pour les dividendes autres que ceux visés au 1) et pour les bénéfices réputés distribués des établissements stables (art. 69, paragraphe 12)"
verifie = false
note = "Ajouté au Lot 1. Les dividendes des sociétés cotées sur une bourse agréée de l'UEMOA relèvent du taux du 1). Issue #37."

[ircm_autres_revenus]
valeur = "0.15"
source = "CGI 2026, art. 86, 3) — 15 % pour tous les autres types de revenus imposables (intérêts, arrérages et produits de créances)"
verifie = false
note = "Ajouté au Lot 1. Les intérêts de prêts non représentés par des titres négociables et les produits de dépôts et comptes courants relèvent de règles particulières (art. 15, paragraphe 4) : à documenter avant le Lot 5. Issue #37."

# L'AIB ne s'applique pas aux loyers d'immeubles : l'art. 131, paragraphe 7 du CGI les renvoie à la
# retenue de l'art. 106 (rescrit DGI 2026). A8 ne doit donc jamais étiqueter un loyer en `AibSupporte`.
