# Facture normalisée (MECeF / e-MECeF) — 2026. Propriétaire : A8, consommé par A4. AUCUNE valeur vérifiée.
# Source attendue : spécification officielle de l'API e-MECeF de la DGI (non obtenue au 2026-11-27) et
# CGI 2026, livre 4, titre 1, chapitre 4 : obligations de facturation (art. 256 et suivants).
# Les groupes de taxation et les codes AIB ci-dessous restent « de mémoire » : issues #24 (code du 3 %) et
# #54 (groupes de taxation A à F).

[en_tete]
annee = 2026
textes = [
  "Code général des impôts du Bénin, édition 2026 — loi n° 2021-15 du 23 décembre 2021, livre 4, titre 1, chapitre 4 : obligations de facturation (art. 256 et suivants)",
  "Spécification officielle de l'API e-MECeF de la DGI (à obtenir auprès de la DGI)",
]
mis_a_jour_le = "2026-11-27"

[[groupe_taxation]]
code = "A"
libelle = "Exonéré"
taux = "0"
source = "Spécification e-MECeF (à obtenir) — groupe de taxation des opérations exonérées (CGI 2026, art. 229)"
verifie = false
note = "Correspondance code ↔ nature de l'opération non confirmée : issue #54."

[[groupe_taxation]]
code = "B"
libelle = "Taxable (TVA 18 %)"
taux = "0.18"
source = "Spécification e-MECeF (à obtenir) — groupe de taxation des opérations taxables au taux de 18 % (CGI 2026, art. 241)"
verifie = false
note = "Issue #54."

[[groupe_taxation]]
code = "C"
libelle = "Exportation de produits taxables"
taux = "0"
source = "Spécification e-MECeF (à obtenir) — groupe de taxation des exportations (CGI 2026, art. 241 et 229)"
verifie = false
note = "Issue #54, à rapprocher de l'issue #51 (taux zéro des exportations)."

[[groupe_taxation]]
code = "D"
libelle = "TVA régime d'exception"
taux = "0.18"
source = "Spécification e-MECeF (à obtenir) — groupe de taxation du régime d'exception"
verifie = false
note = "La nature exacte du « régime d'exception » (et son taux éventuellement réduit) n'est pas documentée : issue #54."

[[groupe_taxation]]
code = "E"
libelle = "Régime fiscal TPS"
taux = "0"
source = "Spécification e-MECeF (à obtenir) — groupe de taxation des ventes des contribuables relevant de la TPS (CGI 2026, art. 178 et suivants)"
verifie = false
note = "Issue #54."

[[groupe_taxation]]
code = "F"
libelle = "Réservé"
taux = "0"
source = "Spécification e-MECeF (à obtenir) — groupe réservé"
verifie = false
note = "Usage réel inconnu : issue #54."

[[code_aib]]
code = "A"
taux = "0.01"
source = "Spécification e-MECeF (à obtenir) — code AIB des opérations au taux de 1 % (CGI 2026, art. 132, 2) a))"
verifie = false
note = "Issue #24."

[[code_aib]]
code = "B"
taux = "0.05"
source = "Spécification e-MECeF (à obtenir) — code AIB des opérations au taux de 5 % (CGI 2026, art. 132, 2) c) et d))"
verifie = false
note = "Le taux de 3 % des prestations de services (art. 132, 2) b)) n'a pas de code connu : issue #24. A4 ne doit pas émettre de facture avec un code AIB inventé."

[types_facture]
valeur = ["FV", "FA", "EV", "EA"]
source = "Spécification e-MECeF (à obtenir) — FV vente, FA avoir, EV vente export, EA avoir export"
verifie = false
note = "Codes repris d'une source commerciale : issue #54."

[types_paiement]
valeur = ["ESPECES", "VIREMENT", "CARTEBANCAIRE", "MOBILEMONEY", "CHEQUES", "CREDIT", "AUTRE"]
source = "Spécification e-MECeF (à obtenir) — nomenclature des modes de paiement"
verifie = false
note = "Nomenclature à confirmer mot pour mot avant émission réelle : issue #54."
