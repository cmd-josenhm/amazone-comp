# cargo-deny : licences compatibles AGPL-3.0, pas de dépendance vulnérable, sources connues uniquement.

[advisories]
version = 2
yanked = "deny"
# Exceptions : chacune justifiée, datée et suivie par une issue. À revoir à chaque version.
ignore = [
    # chrono déclaré « non maintenu » (pas une faille : aucune vulnérabilité connue, aucune version corrigée).
    # Utilisé par tout le projet via ac_noyau::Date. Remplacement (jiff ou time) à décider par ADR — 2026-11-27.
    { id = "RUSTSEC-2026-0543", reason = "chrono non maintenu, sans faille connue ; migration à décider par ADR" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "AGPL-3.0-only",
]
# Exceptions limitées à une seule crate, justifiées et datées.
exceptions = [
  # Sources SQLCipher/SQLite embarquées par rusqlite 0.43 (bundled-sqlcipher, ADR 0005) : « blessing » est la
  # dédicace au domaine public de SQLite, « WTFPL » une licence libre permissive (compatible GPL selon la FSF).
  # Aucune obligation incompatible avec l'AGPL-3.0. Issue #16 — 2026-11-27.
  { allow = ["blessing", "WTFPL"], crate = "sqlcipher-src" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
